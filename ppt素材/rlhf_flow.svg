<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#8C8C8C"/>
    </marker>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#5B7C99"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="#FFFFFF"/>

  <g font-family="Source Han Sans CN, Microsoft YaHei, Noto Sans SC, SimHei, sans-serif">

    <text x="800" y="52" font-size="34" font-weight="700" fill="#2B2B2B" text-anchor="middle">传统RLHF全流程</text>

    <!-- ===== 上半部分：预训练 → SFT → 收集偏好 → 训练奖励模型 ===== -->
    <rect x="71" y="110" width="270" height="72" rx="10" fill="#FFFFFF" stroke="#2B2B2B" stroke-width="1.5"/>
    <text x="206" y="146" font-size="19" fill="#2B2B2B" text-anchor="middle" dominant-baseline="central">预训练模型</text>

    <rect x="467" y="110" width="270" height="72" rx="10" fill="#FFFFFF" stroke="#2B2B2B" stroke-width="1.5"/>
    <text x="602" y="146" font-size="19" fill="#2B2B2B" text-anchor="middle" dominant-baseline="central">SFT监督微调</text>

    <rect x="863" y="110" width="270" height="72" rx="10" fill="#FFFFFF" stroke="#2B2B2B" stroke-width="1.5"/>
    <text x="998" y="146" font-size="19" fill="#2B2B2B" text-anchor="middle" dominant-baseline="central">收集人类偏好数据</text>

    <rect x="1259" y="110" width="270" height="72" rx="10" fill="#FFFFFF" stroke="#2B2B2B" stroke-width="1.5"/>
    <text x="1394" y="146" font-size="19" fill="#2B2B2B" text-anchor="middle" dominant-baseline="central">训练奖励模型PM</text>

    <line x1="341" y1="146" x2="464" y2="146" stroke="#8C8C8C" stroke-width="1.5" marker-end="url(#arr)"/>
    <line x1="737" y1="146" x2="860" y2="146" stroke="#8C8C8C" stroke-width="1.5" marker-end="url(#arr)"/>
    <line x1="1133" y1="146" x2="1256" y2="146" stroke="#8C8C8C" stroke-width="1.5" marker-end="url(#arr)"/>

    <polyline points="1394,182 1394,320 1293,320" fill="none" stroke="#8C8C8C" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="1412" y="255" font-size="15" fill="#8C8C8C">同一模型</text>

    <!-- ===== 下半部分：PPO 容器 ===== -->
    <rect x="60" y="230" width="1480" height="640" rx="12" fill="none" stroke="#8C8C8C" stroke-width="1.5" stroke-dasharray="8 6"/>
    <text x="85" y="262" font-size="20" fill="#5B7C99" font-weight="700">PPO强化学习微调</text>

    <rect x="280" y="320" width="300" height="90" rx="10" fill="#DCE6EC" stroke="#5B7C99" stroke-width="2"/>
    <text x="430" y="365" font-size="19" fill="#2B2B2B" text-anchor="middle" dominant-baseline="central">策略模型（训练中）</text>

    <rect x="1020" y="320" width="300" height="90" rx="10" fill="#F2F2F2" stroke="#8C8C8C" stroke-width="2"/>
    <text x="1170" y="365" font-size="19" fill="#2B2B2B" text-anchor="middle" dominant-baseline="central">奖励模型 PM（冻结）</text>

    <rect x="280" y="500" width="300" height="90" rx="10" fill="#DCE6EC" stroke="#5B7C99" stroke-width="2"/>
    <text x="430" y="545" font-size="19" fill="#2B2B2B" text-anchor="middle" dominant-baseline="central">价值网络（训练中）</text>

    <rect x="1020" y="500" width="300" height="90" rx="10" fill="#F2F2F2" stroke="#8C8C8C" stroke-width="2"/>
    <text x="1170" y="545" font-size="17" fill="#2B2B2B" text-anchor="middle" dominant-baseline="central">参考模型（冻结的SFT副本）</text>

    <rect x="620" y="650" width="360" height="80" rx="10" fill="#FFFFFF" stroke="#2B2B2B" stroke-width="1.5"/>
    <text x="800" y="690" font-size="15" fill="#2B2B2B" text-anchor="middle" dominant-baseline="central">优势 = r − KL惩罚 − 预期奖励</text>

    <!-- 策略模型 → 奖励模型 -->
    <line x1="580" y1="365" x2="1017" y2="365" stroke="#8C8C8C" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="800" y="352" font-size="15" fill="#8C8C8C" text-anchor="middle">生成回答 y → 打分 r</text>

    <!-- 策略模型 → 参考模型（KL） -->
    <polyline points="430,410 430,470 1020,470 1020,542" fill="none" stroke="#8C8C8C" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="700" y="460" font-size="15" fill="#8C8C8C" text-anchor="middle">对比算 KL 惩罚</text>

    <!-- 奖励模型 → 优势（r） -->
    <polyline points="1320,365 1420,365 1420,665 983,665" fill="none" stroke="#8C8C8C" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="1452" y="520" font-size="15" fill="#8C8C8C">r</text>

    <!-- 参考模型 → 优势（KL） -->
    <polyline points="1320,545 1420,545 1420,695 983,695" fill="none" stroke="#8C8C8C" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="1452" y="635" font-size="15" fill="#8C8C8C">KL</text>

    <!-- 价值网络 → 优势（预期奖励） -->
    <polyline points="580,545 600,545 600,680 623,680" fill="none" stroke="#8C8C8C" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="415" y="628" font-size="15" fill="#8C8C8C" text-anchor="middle">预期奖励</text>

    <!-- 优势 → 策略模型（反馈，灰蓝） -->
    <polyline points="800,730 800,780 140,780 140,365 283,365" fill="none" stroke="#5B7C99" stroke-width="2" marker-end="url(#arrBlue)"/>
    <text x="470" y="772" font-size="16" fill="#5B7C99" text-anchor="middle">策略梯度更新（裁剪概率比）</text>

  </g>
</svg>
